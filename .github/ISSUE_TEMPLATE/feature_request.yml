name: Feature request
description: Suggest a new tool, option or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want an agent to be able to do?
      description: Describe the task on the iPhone, not the implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional – a tool name, parameter, or WebDriverAgent endpoint you have in mind.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not require typing passwords, passcodes or payment data on the user's behalf.
          required: true
