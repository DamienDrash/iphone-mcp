name: Bug report
description: Something in iphone-mcp does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please remove anything personal (names, phone numbers, Wi-Fi names, screenshots
        of private content) before posting. **Security problems do not belong here** – use the
        [private reporting form](https://github.com/DamienDrash/iphone-mcp/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did (tool call or command), what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: iphone-mcp version
      description: Output of `uvx iphone-mcp --version`
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
      placeholder: "iPhone 15 Pro Max, iOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Computer the iPhone is connected to
      options:
        - macOS with Xcode
        - macOS without Xcode
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Connection
      options:
        - USB cable
        - Wi-Fi
        - Remote (serve --http)
        - Not sure
  - type: textarea
    id: doctor
    attributes:
      label: Output of `iphone-mcp doctor`
      render: text
  - type: textarea
    id: log
    attributes:
      label: End of the WebDriverAgent log (optional)
      description: Last ~50 lines of `wda-<udid>.log` (path is shown by `iphone-mcp doctor`).
      render: text
