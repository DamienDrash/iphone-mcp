[project]
name = "iphone-mcp"
dynamic = ["version"]
description = "MCP server that lets AI agents (Claude Code, Codex, …) see and control a real iPhone over USB or Wi-Fi"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Damien Frigewski" }]
maintainers = [{ name = "Damien Frigewski" }]
keywords = ["mcp", "model-context-protocol", "iphone", "ios", "automation", "webdriveragent", "xcuitest", "claude", "codex", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
# Upper bounds = the major versions iphone-mcp is tested with; raised deliberately after testing.
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp>=2.3,<3",
    "pillow>=11.0.0,<14",
    "pydantic>=2.7,<3",
    "pymobiledevice3>=11.59.0,<12",
]

[project.scripts]
iphone-mcp = "iphone_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/DamienDrash/iphone-mcp"
Repository = "https://github.com/DamienDrash/iphone-mcp"
Issues = "https://github.com/DamienDrash/iphone-mcp/issues"
Changelog = "https://github.com/DamienDrash/iphone-mcp/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/DamienDrash"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "iphone_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["iphone_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.11"
packages = ["iphone_mcp"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pymobiledevice3.*"]
ignore_missing_imports = true
