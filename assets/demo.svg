<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Example session</title>
  <desc id="d">An agent asked which Wi-Fi the iPhone is on starts the agent, opens Settings, reads the UI tree and answers.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="430" rx="18" fill="#0d1117"/>
  <rect width="900" height="44" rx="18" fill="#161b22"/>
  <rect y="26" width="900" height="18" fill="#161b22"/>
  <rect y="43" width="900" height="2" fill="url(#bar)" opacity="0.8"/>
  <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="7" fill="#febc2e"/>
  <circle cx="70" cy="22" r="7" fill="#28c840"/>
  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial" font-size="13" fill="#8b949e">claude — iphone-mcp</text>

  <g font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15">
    <text x="28" y="86" fill="#7ee787">&gt;</text>
    <text x="46" y="86" fill="#e6edf3">Open Settings on my iPhone and tell me which Wi-Fi I'm on.</text>

    <text x="28" y="130" fill="#a78bfa">⏺</text>
    <text x="50" y="130" fill="#e6edf3" font-weight="700">iphone_start_agent</text>
    <text x="56" y="152" fill="#6e7681">⎿</text><text x="80" y="152" fill="#8b949e">WebDriverAgent is running, connected via Wi-Fi (Xcode tunnel).</text>

    <text x="28" y="190" fill="#a78bfa">⏺</text>
    <text x="50" y="190" fill="#e6edf3" font-weight="700">iphone_launch_app</text>
    <text x="214" y="190" fill="#8b949e">(app: "Settings")</text>
    <text x="56" y="212" fill="#6e7681">⎿</text><text x="80" y="212" fill="#8b949e">Launched com.apple.Preferences.</text>

    <text x="28" y="250" fill="#a78bfa">⏺</text>
    <text x="50" y="250" fill="#e6edf3" font-weight="700">iphone_ui_tree</text>
    <text x="56" y="272" fill="#6e7681">⎿</text><text x="80" y="272" fill="#8b949e">[Button] "Wi-Fi, Home Network" @(215,480) 390×52</text>
    <text x="80" y="294" fill="#8b949e">[Button] "Bluetooth, On" @(215,532) 390×52</text>
    <text x="80" y="316" fill="#8b949e">…</text>

    <text x="28" y="360" fill="#7ee787">⏺</text>
    <text x="50" y="360" fill="#e6edf3">Your iPhone is connected to the Wi-Fi network</text>
    <text x="50" y="382" fill="#22d3ee" font-weight="700">“Home Network”.</text>
  </g>
</svg>
