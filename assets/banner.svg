<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">iphone-mcp</title>
  <desc id="d">Let AI agents see and control your real iPhone over USB or Wi-Fi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#2a1550"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.78" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2350"/>
      <stop offset="1" stop-color="#0f1330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="28" fill="url(#glow1)"/>
  <rect width="1280" height="440" rx="28" fill="url(#glow2)"/>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80 92)">
      <rect width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="20" cy="17" r="5" fill="#34d399"/>
      <text x="34" y="22.5" font-size="15" fill="#e5e7eb" font-weight="600" letter-spacing="0.3">Model Context Protocol</text>
    </g>
    <text x="78" y="212" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-2">iphone-mcp</text>
    <text x="82" y="262" font-size="27" fill="#cbd5e1" font-weight="500">Let AI agents <tspan fill="#ffffff" font-weight="700">see</tspan> and <tspan fill="#ffffff" font-weight="700">control</tspan> your real iPhone.</text>

    <g font-size="16" font-weight="600" fill="#e2e8f0">
      <g transform="translate(82 310)">
        <rect width="92" height="36" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="46" y="23.5" text-anchor="middle">USB</text>
      </g>
      <g transform="translate(184 310)">
        <rect width="92" height="36" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="46" y="23.5" text-anchor="middle">Wi-Fi</text>
      </g>
      <g transform="translate(286 310)">
        <rect width="140" height="36" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="70" y="23.5" text-anchor="middle">Claude Code</text>
      </g>
      <g transform="translate(436 310)">
        <rect width="100" height="36" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="50" y="23.5" text-anchor="middle">Codex</text>
      </g>
      <g transform="translate(546 310)">
        <rect width="190" height="36" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="95" y="23.5" text-anchor="middle">any MCP client</text>
      </g>
    </g>
    <text x="82" y="388" font-size="15" fill="#94a3b8">macOS · Linux · Windows  —  no jailbreak, signed with your own Apple ID</text>
  </g>

  <!-- signal arcs -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" opacity="0.9">
    <path d="M820 220 q 22 -22 0 -44" stroke-width="4" opacity="0.5"/>
    <path d="M800 236 q 40 -40 0 -80" stroke-width="4" opacity="0.35"/>
    <path d="M780 252 q 58 -58 0 -116" stroke-width="4" opacity="0.2"/>
  </g>

  <!-- phone -->
  <g transform="translate(888 38) rotate(6 120 182)">
    <rect x="0" y="0" width="240" height="364" rx="44" fill="#0a0d1f" stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="12" y="12" width="216" height="340" rx="34" fill="url(#screen)"/>
    <rect x="86" y="22" width="68" height="20" rx="10" fill="#05060f"/>
    <!-- status bar -->
    <text x="34" y="37" font-family="-apple-system, Helvetica, Arial" font-size="12" font-weight="700" fill="#e5e7eb">9:41</text>
    <!-- ui rows -->
    <g font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#e5e7eb">
      <rect x="28" y="62" width="184" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="48" cy="82" r="10" fill="#3b82f6"/>
      <text x="66" y="86">Wi-Fi</text>
      <rect x="28" y="110" width="184" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="48" cy="130" r="10" fill="#22c55e"/>
      <text x="66" y="134">Bluetooth</text>
      <rect x="28" y="158" width="184" height="40" rx="12" fill="#a78bfa" fill-opacity="0.28" stroke="#c4b5fd" stroke-opacity="0.8"/>
      <circle cx="48" cy="178" r="10" fill="#f59e0b"/>
      <text x="66" y="182" font-weight="700">Display &amp; Brightness</text>
      <rect x="28" y="206" width="184" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="48" cy="226" r="10" fill="#ef4444"/>
      <text x="66" y="230">Notifications</text>
      <rect x="28" y="254" width="184" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="48" cy="274" r="10" fill="#8b5cf6"/>
      <text x="66" y="278">General</text>
    </g>
    <!-- tap ripple -->
    <circle cx="196" cy="178" r="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="196" cy="178" r="6" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="90" y="334" width="60" height="5" rx="2.5" fill="#e5e7eb" fill-opacity="0.6"/>
  </g>

  <!-- tool call bubble -->
  <g transform="translate(616 54)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <rect width="268" height="48" rx="14" fill="#0b1020" fill-opacity="0.85" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="18" y="30" fill="#a78bfa">iphone_tap_text</text>
    <text x="160" y="30" fill="#e2e8f0">("Display")</text>
  </g>
</svg>
